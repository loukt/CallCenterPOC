name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - 001-outbound-callcenter-poc
      - 002-voicelive-integration
      - 003-agentic-contact-center
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  API_APP_NAME: contactcenterpoc-api
  API_RESOURCE_GROUP: contactcenterpoc
  APP_APP_NAME: contactcenterpoc-app
  APP_RESOURCE_GROUP: contactcenterpoc

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ContactCenter-API/ContactCenter-API.csproj

      - name: Build
        run: dotnet build ContactCenter-API/ContactCenter-API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ContactCenter-API/ContactCenter-API.csproj --configuration Release --no-build --output ./api-publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ./api-publish

  build-app:
    name: Build APP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ContactCenter-APP/ContactCenter-APP.csproj

      - name: Build
        run: dotnet build ContactCenter-APP/ContactCenter-APP.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ContactCenter-APP/ContactCenter-APP.csproj --configuration Release --no-build --output ./app-publish

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: ./app-publish

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test CallCenterPOC-API.Tests/CallCenterPOC-API.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Unit" --verbosity normal

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [build-api, test]
    environment:
      name: production
      url: https://contactcenterpoc-api.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: ./api-publish

      - name: Deploy to Azure App Service (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ./api-publish

      - name: Azure login for API settings
        if: secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_API_APPSETTINGS_JSON != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Write API App Settings file
        if: secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_API_APPSETTINGS_JSON != ''
        shell: pwsh
        env:
          API_APP_SETTINGS_JSON: ${{ secrets.AZURE_API_APPSETTINGS_JSON }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'api-appsettings.json'
          Set-Content -LiteralPath $path -Value $env:API_APP_SETTINGS_JSON -Encoding utf8
          "API_APP_SETTINGS_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply API App Settings
        if: secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_API_APPSETTINGS_JSON != ''
        shell: pwsh
        run: |
          ./scripts/Set-AppServiceSettings.ps1 `
            -ResourceGroup ${{ env.API_RESOURCE_GROUP }} `
            -AppName ${{ env.API_APP_NAME }} `
            -SettingsFile $env:API_APP_SETTINGS_FILE

  deploy-app:
    name: Deploy APP
    runs-on: ubuntu-latest
    needs: [build-app, test]
    environment:
      name: production
      url: https://contactcenterpoc-app.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - name: Download APP artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: ./app-publish

      - name: Deploy to Azure App Service (APP)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_PUBLISH_PROFILE }}
          package: ./app-publish

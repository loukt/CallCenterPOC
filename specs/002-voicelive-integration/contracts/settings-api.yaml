openapi: 3.0.3
info:
  title: ContactCenter Settings API — VoiceLive Extension
  version: 2.0.0
  description: |
    Settings API contract changes for the 002-voicelive-integration feature.
    Extends the existing GET/PUT /api/Settings endpoints with VoiceLive fields.

paths:
  /api/Settings:
    get:
      operationId: getSettings
      summary: Get current operator settings with VoiceLive metadata
      responses:
        '200':
          description: Current settings plus VoiceLive availability info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'

    put:
      operationId: updateSettings
      summary: Update operator settings (including VoiceLive fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsRequest'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: Validation error

components:
  schemas:
    SettingsRequest:
      type: object
      properties:
        maxCallTimeMinutes:
          type: number
          format: double
          minimum: 0.5
          maximum: 30
          default: 2.0
          description: Maximum call duration in minutes
        voiceApiMode:
          type: string
          enum: [ChatGPT, VoiceLive]
          default: ChatGPT
          description: Voice engine selection
        selectedVoice:
          type: string
          default: alloy
          description: OpenAI voice (used when voiceApiMode is ChatGPT)
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        transcriptionMode:
          type: string
          enum: [BuiltIn, SeparateSTT]
          default: BuiltIn
          description: Transcription source for VoiceLive calls (ignored when voiceApiMode is ChatGPT)
        voiceLiveModel:
          type: string
          enum: [gpt-realtime, gpt-4o, gpt-4.1, gpt-5, phi-4-mini]
          default: gpt-4o
          description: LLM model for VoiceLive sessions (ignored when voiceApiMode is ChatGPT)
        selectedVoiceLiveVoice:
          type: string
          default: en-US-Ava:DragonHDLatestNeural
          description: Dragon HD voice full name for VoiceLive (ignored when voiceApiMode is ChatGPT)

    SettingsResponse:
      allOf:
        - $ref: '#/components/schemas/SettingsRequest'
        - type: object
          properties:
            voiceLiveConfigured:
              type: boolean
              description: Whether the VoiceLive service endpoint is configured in app settings
            availableVoiceLiveVoices:
              type: array
              description: Available Dragon HD voices grouped by locale
              items:
                $ref: '#/components/schemas/VoiceLiveVoiceInfo'
            availableVoiceLiveModels:
              type: array
              description: Available LLM models for VoiceLive
              items:
                type: string

    VoiceLiveVoiceInfo:
      type: object
      properties:
        fullName:
          type: string
          description: Full Azure voice name (e.g., en-US-Ava:DragonHDLatestNeural)
        displayName:
          type: string
          description: Short display name (e.g., Ava)
        locale:
          type: string
          description: BCP-47 locale (e.g., en-US)
        gender:
          type: string
          enum: [Male, Female]
